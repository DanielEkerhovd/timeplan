# Supabase-oppsett som hører til repoet. Prosjekt-id settes av `supabase link`.

[functions.share-image]
verify_jwt = false
# Uten disse to linjene finner ikke funksjonen fontene og wasm-en, og bildet feiler med 500.
# Feilmeldingen sier hvilken fil som mangler.
static_files = ["./functions/share-image/fonts/*.woff", "./functions/share-image/resvg.wasm"]
