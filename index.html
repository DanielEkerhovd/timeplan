<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" />
    <title>Gatherapp.gg - Planning tool for teams and groups</title>
    <meta
      name="description"
      content="Sick of juggling messages and polls on Discord? Gatherapp.gg keeps track of your group's availability. Plan scrims, matches, hangouts or whatever, and share a link to the week on Discord. No signups, no ads, no tracking."
    />
    <link rel="canonical" href="https://www.gatherapp.gg/" />

    <!-- Når noen limer inn selve appen (ikke en delt uke), er det dette som vises. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gatherapp.gg" />
    <meta property="og:url" content="https://www.gatherapp.gg/" />
    <!-- Discord skriver site_name («Gatherapp.gg») over tittelen, så tittelen her er
         setningen fra forsiden i stedet for navnet en gang til. -->
    <meta property="og:title" content="When can you play this week?" />
    <meta
      property="og:description"
      content="Sick of juggling messages and polls on Discord? Gatherapp.gg keeps track of your group's availability. Plan scrims, matches, hangouts or whatever, and share a link to the week on Discord. No signups, no ads, no tracking. Made for Discord, by people who use Discord. A lot."
    />
    <!-- Bredt bilde, ikke ikonet: Discord og Slack tegner en liten firkant av
         et kvadratisk og:image, og en stor plakat av et 1200x630. -->
    <meta property="og:image" content="https://www.gatherapp.gg/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="A week in Gatherapp.gg: everyone's hours, the block where the whole team is free, and the match booked there."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
